# docs/11-testing-plan.md §7.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      # Same image as docker-compose.yml. Integration tests build suburi_test from the migrations.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: suburi
          POSTGRES_PASSWORD: suburi
          POSTGRES_DB: suburi
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U suburi -d suburi"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    # Well-formed placeholders so the production server boots. No real credential.
    env:
      DATABASE_URL: postgresql://suburi:suburi@localhost:5433/suburi
      DATABASE_URL_UNPOOLED: postgresql://suburi:suburi@localhost:5433/suburi
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-a-real-one
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      ALLOWED_EMAIL: ci@example.com
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Integration tests
        run: npm run test:integration
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Playwright's global setup builds its own suburi_e2e database from the migrations.
      - name: End-to-end
        run: npm run test:e2e
      - name: Audit
        run: npm audit --audit-level=high
